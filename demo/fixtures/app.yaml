# PowerDuck service configuration
service:
  name: powerduck
  enabled: true
  replicas: 2

storage:
  path: ./data
  encrypt: true

plugins:
  - name: spellcheck
    enable: true
  - name: export
    enable: true
info:
  version: 1.1.0
  title: ""
servers:
  - url: https://api.prod.example.com/v1
paths:
  /pets:
    get:
      responses:
        "404":
          description: Resource not found
