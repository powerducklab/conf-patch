openapi: 3.2.0
info:
  title: ""
  description: OpenAPI 3.2 with structured tags and QUERY method
  version: 1.1.0

servers:
  - url: https://api.prod.example.com/v1

tags:
  - name: pets
    summary: Pet Management
    description: All pet related operations
    kind: nav
  - name: search
    summary: Search endpoints
    parent: pets
    kind: nav

paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
        "404":
          description: Resource not found

  /pets/search:
    query:
      summary: Advanced fuzzy pet search
      operationId: searchPets
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    PetList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        total:
          type: integer
          minimum: 0
