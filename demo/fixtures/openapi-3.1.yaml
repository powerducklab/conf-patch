openapi: 3.1.0
info:
  title: ""
  description: Sample OpenAPI 3.1 Spec for confedit demo
  version: 1.1.0
servers:
  - url: https://api.prod.example.com/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
        "404":
          description: Resource not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    PetList:
      type: array
      items:
        $ref: '#/components/schemas/Pet'
